name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 같은 브랜치/PR에 연달아 push하면 이전 실행은 취소하고 최신 것만 돌린다 —
# Actions 분당 한도를 중복 실행으로 낭비하지 않기 위함.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    # [2026-07-28 추가] 실제 서버는 MySQL인데 CI는 계속 SQLite로 돌아서 "테스트는
    # 통과했는데 서버에서만 FK 에러가 난다"(예: MedicationLog 삭제 이슈) 같은 문제가
    # 반복됐다 — CI도 실제 운영과 같은 MySQL로 돌린다. backend/tests/conftest.py의
    # make_test_engine()이 이 DATABASE_URL을 그대로 써서 각 테스트가 이 MySQL을
    # 쓰게 된다(로컬에서 DATABASE_URL 없이 그냥 pytest를 돌리면 지금처럼 SQLite).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ah0402_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .
        continue-on-error: true  # 57건 pre-existing(B904/E402/B905/N806 등) 팀 파일 분산 — 팀 전체 정리 후 필수 게이트로 전환 예정

      - name: Type check (ty)
        run: uv run ty check .
        continue-on-error: true  # 69건 잔존(SQLModel false positive 억제 후) — 팀원 파일 포함, 당장 필수 게이트로 쓰지 않음

      - name: Test (pytest)
        run: uv run pytest backend/tests/ -q
        env:
          APP_ENV: test
          DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/ah0402_ci

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    timeout-minutes: 10

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd AH_04_02 && git pull origin dev && docker compose up -d --build
