name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 같은 브랜치/PR에 연달아 push하면 이전 실행은 취소하고 최신 것만 돌린다 —
# Actions 분당 한도를 중복 실행으로 낭비하지 않기 위함.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .
        continue-on-error: true  # 57건 pre-existing(B904/E402/B905/N806 등) 팀 파일 분산 — 팀 전체 정리 후 필수 게이트로 전환 예정

      - name: Type check (ty)
        run: uv run ty check .
        continue-on-error: true  # 69건 잔존(SQLModel false positive 억제 후) — 팀원 파일 포함, 당장 필수 게이트로 쓰지 않음

      - name: Test (pytest)
        run: uv run pytest backend/tests/ -q
        env:
          APP_ENV: test
          DATABASE_URL: sqlite://

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    timeout-minutes: 10

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd AH_04_02
            mkdir -p backend/certs
            echo "${{ secrets.AIVEN_CA_CERT_BASE64 }}" | base64 -d > backend/certs/aiven-ca.pem
            [ -s backend/certs/aiven-ca.pem ] || { echo "AIVEN_CA_CERT_BASE64 secret이 비어있거나 잘못됨"; exit 1; }
            git fetch origin dev
            git merge --ff-only origin/dev || {
              echo "⚠️ Fast-forward 실패 - EC2 로컬에 예상치 못한 변경이 있습니다. 강제 리셋합니다."
              git reset --hard origin/dev
            }
            docker compose -f docker-compose.yml up -d --build
            # [2026-08-04 추가, 실제 재현된 장애] backend/Dockerfile은 코드를 이미지에
            # COPY하지 않고 바인드마운트로만 받는다(pyproject.toml/uv.lock만 이미지에
            # 들어감) — 그래서 코드만 바뀌면 이미지 해시가 그대로라 위 --build가 아무
            # 컨테이너도 재생성하지 않고, uvicorn 워커는 맨 처음 뜬 시점에 import해둔
            # 모듈을 계속 메모리에 붙든 채로 돈다. git은 최신을 받아오는데 실행 중인
            # 프로세스는 옛 코드 그대로인 상태가 배포마다 조용히(exit 0으로) 반복됐다
            # (실제 사고: 2026-08-03 11:39 배포 이후 20시간·배포 7회 동안 알림함 삭제
            # API가 전부 404, 복약 알림 스케줄러는 60초마다 계속 예외를 내며 발송이
            # 멈춤 — 그런데도 GitHub Actions는 매번 success로 표시됨).
            #
            # 마이그레이션을 먼저 적용한다 — backend/alembic/versions/는 바인드마운트라
            # 컨테이너를 아직 재시작하지 않은 지금도 방금 git이 받아온 최신 파일을 그대로
            # 본다. 컨테이너를 재생성하기 전에 스키마부터 맞춰야, "새 코드가 옛 스키마를
            # 조회해서 500"이 되는 창구 자체가 생기지 않는다.
            docker compose -f docker-compose.yml exec -T backend sh -c \
              "cd /workspace/backend && /workspace/.venv/bin/python3 -m alembic upgrade head"
            # 스키마를 맞췄으니 이제 --force-recreate로 매 배포마다 컨테이너를 무조건
            # 새로 띄운다 — 위 근본 원인(이미지 해시 불변으로 재생성 안 되던 문제)의
            # 직접적인 수정.
            docker compose -f docker-compose.yml up -d --build --force-recreate
            # [2026-07-31 추가, 리뷰 지적 반영] 매 배포마다 --build로 새 이미지를 만들면서
            # 예전 이미지가 계속 쌓여 EC2 디스크를 채운다(실제로 40G 중 40G까지 차서 배포
            # 자체가 실패하는 장애로 재현됨) — 배포마다 정리한다. `-a`는 dangling(태그 없는)
            # 이미지만이 아니라 태그가 있어도 어떤 컨테이너에도 안 물린 이미지까지 전부
            # 지운다(실행 중인 컨테이너가 쓰는 이미지만 제외) — 이 레포는 롤백용 버전 태그
            # 체계가 없어(롤백은 git reset --hard 쪽에서 처리) 당장 문제는 없지만, 그만큼
            # 넓은 범위라는 점은 인지하고 있을 것.
            # `|| true`: 이 시점엔 이미 새 컨테이너가 정상 기동된 뒤라, 정리 자체가(데몬
            # 일시 오류 등으로) 실패해도 실제 배포는 성공이다 — set -e 때문에 정리 실패가
            # 그대로 배포 실패로 잘못 표시되지 않도록 막는다.
            docker image prune -af || true
