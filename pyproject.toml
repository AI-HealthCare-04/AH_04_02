[project]
name = "health-companion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "python-multipart",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt<=4.0.1",
    "cryptography",
    "email-validator",
    "python-dotenv",
    "requests>=2.32",
    "pandas",
    "openpyxl",
    "rapidfuzz",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pymysql>=1.2.0",
    "alembic>=1.18.5",
    "langfuse>=3.0",
]

# backend(routers/chat_router.py)가 rag/를 sys.path에 얹어 같은 프로세스에서 import하므로
# (CHAT_PROVIDER=real/RAG_PROVIDER=real일 때), 두 requirements.txt(backend/, rag/)를
# 별도 venv가 아니라 이 pyproject.toml 하나로 합쳐서 관리한다.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv", "venv", "__pycache__", ".git",
    "migrations", "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line-length는 formatter에 위임
    "B008",  # FastAPI Depends() in default args — 관용 패턴, false positive
]
