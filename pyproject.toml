[project]
name = "health-companion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "python-multipart",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt<=4.0.1",
    "cryptography",
    "email-validator",
    "python-dotenv",
    "requests>=2.32",
    "pandas",
    "openpyxl",
    "rapidfuzz",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pymysql>=1.2.0",
    "alembic>=1.18.5",
    "langfuse>=3.0",
    "torch",  # sentence-transformers 간접 의존성 — CPU 전용 wheel 강제하려고 직접 명시(아래 tool.uv.sources)
    "pywebpush>=2.0",  # [2026-07-24 추가] Web Push 실발송(VAPID) — 프론트 서비스워커/구독은 HTTPS 배포 이후
    "opencv-python-headless>=5.0.0.93",  # [2026-07-28 추가] 카메라 촬영 처방전 사진 전처리(services/image_preprocessing.py)
    "pillow>=10.0",  # [2026-07-28] 기존엔 dev 전용(목업 스크립트)이었으나, image_preprocessing.py가 운영 경로에서 EXIF 방향 보정에 씀 — main으로 승격
]

# backend(routers/chat_router.py)가 rag/를 sys.path에 얹어 같은 프로세스에서 import하므로
# (CHAT_PROVIDER=real/RAG_PROVIDER=real일 때), 두 requirements.txt(backend/, rag/)를
# 별도 venv가 아니라 이 pyproject.toml 하나로 합쳐서 관리한다.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.59",
    "pillow>=10.0",       # generate_mock_*.py 스크립트 + TesseractOCRProvider 폴백
    "pytesseract>=0.3",   # TesseractOCRProvider CLOVA 장애 폴백 (시스템: brew install tesseract)
]

# torch가 sentence-transformers/langchain-huggingface의 간접 의존성으로 들어오는데,
# 지정 안 하면 기본 registry가 리눅스용 CUDA 툴킷(nvidia-* 15종, 수GB)까지 같이
# 끌고 온다 — 개발 컨테이너/서버 다 GPU 패스스루가 없어서 100% 낭비. CPU 전용
# wheel로 고정해서 uv.lock 자체가 가벼운 버전을 가리키게 한다.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ty.environment]
# rag/, backend/, backend/scripts/는 venv 외부의 내부 패키지 경로
# (rag.config, services.langfuse_tracing, purge_expired_accounts 등 unresolved-import 방지)
extra-paths = ["rag", "backend", "backend/scripts"]

[tool.ty.src]
# alembic 자동생성 버전 파일·일회성 마이그레이션 스크립트는 타입 검사 대상 제외
# (ty check 대상: routers, services, core, tests, main, rag 패키지만)
include = [
    "backend/core/**", "backend/routers/**", "backend/services/**",
    "backend/tests/**", "backend/main.py",
    "rag/rag/**", "rag/tests/**",
]

[tool.ty.rules]
# SQLModel/SQLAlchemy ORM 디스크립터 false positive 전역 억제
# LaxInt 패턴 (model.id: int|None → SQLModel constructor int 기대),
# ColumnElement 패턴 (.where(col==val) → bool로 추론),
# .order_by(col) → Python 기본 타입으로 추론 등 ~115건이 이 규칙에서 발생.
# ty 0.0.59는 SQLAlchemy InstrumentedAttribute 디스크립터를 지원하지 않아 생기는 false positive.
# 런타임 동작에는 영향 없음. ty가 SQLModel 지원을 추가하면 이 줄을 제거할 것.
"invalid-argument-type" = "ignore"

# ---------------------------------------------------------------------------
# ty check 잔여 진단 현황 (2026-07-16 기준)
#   위 설정 적용 후: 73건 (295 - 115 invalid-argument-type - 107 alembic/scripts 제외)
#
# ■ 본인 파일 (권순현): records_router.py 3건, rag_router.py 1건
# ■ 팀원 파일: monitoring 7, auth 7, patient_medications 5, chat 3, care 2, rag_chain 2
# ■ 테스트: test_purge 13, test_login_lockout 12, test_account_withdrawal 11, 기타 4
# ■ unresolved-attribute 중 ORM 패턴(.desc/.in_/.is_)은 팀원 파일에 집중 —
#   팀원 PR 리뷰 시 inline `# ty: ignore[unresolved-attribute]` 추가 권장
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv", "venv", "__pycache__", ".git",
    "migrations", "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line-length는 formatter에 위임
    "B008",  # FastAPI Depends() in default args — 관용 패턴, false positive
]
