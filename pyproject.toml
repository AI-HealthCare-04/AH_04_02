[project]
name = "health-companion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "python-multipart",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt<=4.0.1",
    "cryptography",
    "email-validator",
    "python-dotenv",
    "requests>=2.32",
    "pandas",
    "openpyxl",
    "rapidfuzz",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pymysql>=1.2.0",
    "alembic>=1.18.5",
    "langfuse>=3.0",
]

# backend(routers/chat_router.py)가 rag/를 sys.path에 얹어 같은 프로세스에서 import하므로
# (CHAT_PROVIDER=real/RAG_PROVIDER=real일 때), 두 requirements.txt(backend/, rag/)를
# 별도 venv가 아니라 이 pyproject.toml 하나로 합쳐서 관리한다.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",       # generate_mock_*.py 스크립트 + TesseractOCRProvider 폴백
    "pytesseract>=0.3",   # TesseractOCRProvider CLOVA 장애 폴백 (시스템: brew install tesseract)
]

[tool.ty.environment]
# rag/, backend/, backend/scripts/는 venv 외부의 내부 패키지 경로
# (rag.config, services.langfuse_tracing, purge_expired_accounts 등 unresolved-import 방지)
extra-paths = ["rag", "backend", "backend/scripts"]

# ---------------------------------------------------------------------------
# ty check 잔여 진단 현황 (2026-07-16 기준, 295건)
#
# ■ SQLModel/SQLAlchemy ORM 디스크립터 false positive (~130건) — 무시 가능
#   ty가 SQLModel 컬럼 필드를 Python 기본 타입(int, datetime, bool)으로 추론해서
#   SQLAlchemy가 런타임에 제공하는 ORM 메서드를 "없다"고 오판:
#     - Column.desc() / Column.asc()  →  "datetime has no attribute desc"
#     - Column.in_(...)               →  "int has no attribute in_"
#     - Column.is_(None)              →  "datetime|None has no attribute is_"
#     - Model(**kwargs) LaxInt        →  "int|None is not assignable to LaxInt"
#     - .where(col == val)            →  "bool is not assignable to ColumnElement"
#   SQLModel/SQLAlchemy는 InstrumentedAttribute 디스크립터로 이 메서드를 동적 제공하며
#   ty 0.0.59는 이 패턴을 아직 지원하지 않는다. 런타임 동작에는 영향 없음.
#
# ■ 실제 수정된 이슈 (6건, 이 커밋에서 처리)
#   - Sequence[OcrResult] 시그니처 통일 (chat/rag/records router 4곳)
#   - alembic/env.py url None 체크 추가
#   - chat_router.py response.content isinstance 타입 가드
#
# ■ 추후 처리 대상 (~165건)
#   - invalid-argument-type: Sequence vs list 잔여, Literal vs str, Union 미검사 등
#   - unresolved-attribute: result.rowcount, response.content (LangChain), alembic 잔여
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv", "venv", "__pycache__", ".git",
    "migrations", "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line-length는 formatter에 위임
    "B008",  # FastAPI Depends() in default args — 관용 패턴, false positive
]
